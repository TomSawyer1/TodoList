# ===========================================
# Configuration de l'application Todo List
# ===========================================

# Nom de l'application
spring.application.name=Todo List API

# Port du serveur
server.port=8080

# ===========================================
# Configuration SQLite
# ===========================================

# URL de connexion SQLite (fichier local)
spring.datasource.url=jdbc:sqlite:todos.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Dialecte Hibernate pour SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Création automatique des tables
spring.jpa.hibernate.ddl-auto=create-drop

# Configuration pour SQLite - utiliser une séquence simulée
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=false

# Affichage des requêtes SQL (désactiver en production)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===========================================
# Configuration Swagger / OpenAPI
# ===========================================

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ===========================================
# Configuration des logs
# ===========================================

# Niveau de log général
logging.level.root=INFO

# Logs de l'application
logging.level.com.todolist=DEBUG

# Logs SQL (désactiver en production)
logging.level.org.hibernate.SQL=DEBUG

# Format des logs
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
